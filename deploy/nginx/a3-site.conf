# Nginx config for the A3 FOR YOU shop (include next to the existing server blocks).
# app.a3.kg and backend.a3.kg are NOT touched — they keep pointing at the dealer application.
#
# Nginx runs as a container in the docker network `a3-network` and reaches the site by
# container name: the pipeline starts it as `a3-web` (listens on 3000 inside the network).
# Cloudflare stays in front: DNS for a3.kg / www.a3.kg / a3-dev.xyz already points to the server.
#
# The deploy recreates the container, so its IP changes. Resolve the name at request time
# (docker's embedded DNS 127.0.0.11) instead of once at nginx start, otherwise nginx keeps
# talking to the old IP and returns 502 until it is reloaded.

# production server: a3.kg -> a3-web:3000
server {
    listen 80;
    listen [::]:80;
    server_name a3.kg www.a3.kg;

    # photos uploaded in the admin panel are up to 10 MB
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    resolver 127.0.0.11 valid=10s;
    set $a3_upstream a3-web:3000;

    location / {
        proxy_pass http://$a3_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# dev server: a3-dev.xyz -> a3-web:3000 (the dev server is a different machine, same container name)
server {
    listen 80;
    listen [::]:80;
    server_name a3-dev.xyz www.a3-dev.xyz;

    client_max_body_size 12m;

    resolver 127.0.0.11 valid=10s;
    set $a3_upstream a3-web:3000;

    location / {
        proxy_pass http://$a3_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # keep the test site out of search engines
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
