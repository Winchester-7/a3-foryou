# Nginx config for the A3 FOR YOU shop (include next to the existing server blocks).
# app.a3.kg and backend.a3.kg are NOT touched — they keep pointing at the dealer application.
#
# Cloudflare stays in front: DNS for a3.kg / www.a3.kg is already proxied to this server.

# production: a3.kg -> container on port 3000
server {
    listen 80;
    listen [::]:80;
    server_name a3.kg www.a3.kg;

    # photos uploaded in the admin panel are up to 10 MB
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# test: a3-dev.xyz -> container on port 3001
server {
    listen 80;
    listen [::]:80;
    server_name a3-dev.xyz www.a3-dev.xyz;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # keep the test site out of search engines
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
