# CI/CD for GitLab: build the Docker image and roll it out on the server.
#   branch dev  -> a3-dev.xyz (test)
#   branch main -> a3.kg      (production)
#
# Variables to set in GitLab (Settings -> CI/CD -> Variables):
#   SSH_PRIVATE_KEY   private key of the deploy user on the server (type: Variable, masked)
#   DEPLOY_HOST       server address
#   DEPLOY_USER       deploy user (member of the docker group)
#   DEV_DIR / PROD_DIR  folders with docker-compose.yml + .env on the server (defaults below)
#   SITE_URL_DEV / SITE_URL_PROD  public addresses (defaults below)

stages:
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  SITE_URL_DEV: "https://a3-dev.xyz"
  SITE_URL_PROD: "https://a3.kg"
  DEV_DIR: "/srv/a3-site-dev"
  PROD_DIR: "/srv/a3-site-prod"

.build:
  stage: build
  image: docker:26
  services:
    - docker:26-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - >
      docker build
      --build-arg NEXT_PUBLIC_SITE_URL="$SITE_URL"
      -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

build_dev:
  extends: .build
  variables:
    IMAGE_TAG: dev
    SITE_URL: $SITE_URL_DEV
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

build_prod:
  extends: .build
  variables:
    IMAGE_TAG: latest
    SITE_URL: $SITE_URL_PROD
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

.deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - >
      ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "cd $TARGET_DIR &&
      echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY' &&
      A3_IMAGE=$CI_REGISTRY_IMAGE:$IMAGE_TAG docker compose pull &&
      A3_IMAGE=$CI_REGISTRY_IMAGE:$IMAGE_TAG docker compose up -d &&
      docker image prune -f"

deploy_dev:
  extends: .deploy
  needs: [build_dev]
  variables:
    IMAGE_TAG: dev
    TARGET_DIR: $DEV_DIR
  environment:
    name: dev
    url: $SITE_URL_DEV
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

deploy_prod:
  extends: .deploy
  needs: [build_prod]
  variables:
    IMAGE_TAG: latest
    TARGET_DIR: $PROD_DIR
  environment:
    name: production
    url: $SITE_URL_PROD
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
